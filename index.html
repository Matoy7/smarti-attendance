<!doctype html>
<html lang="<!-- figma:lang -->" dir="rtl">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <meta name="theme-color" content="#f7f3ed" />
    <script>
      // Theme before first paint (no light flash). Same rules as src/lib/theme.ts.
      try {
        var t = localStorage.getItem('smartime.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {
        t = 'light'
      }
      document.documentElement.dataset.theme = t
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#021713')
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
